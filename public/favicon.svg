<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tiles">
  <style>
    .plate {
      fill: #f5f5f5;
    }
    .tile {
      fill: #1e1e1e;
    }
    .tile-mid {
      opacity: 0.5;
    }
    .tile-soft {
      opacity: 0.26;
    }
    @media (prefers-color-scheme: dark) {
      .plate {
        fill: #1e1e1e;
      }
      .tile {
        fill: #f5f5f5;
      }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14" />
  <rect class="tile" x="6" y="6" width="24" height="24" rx="5" />
  <rect class="tile tile-mid" x="34" y="6" width="24" height="24" rx="5" />
  <rect class="tile tile-mid" x="6" y="34" width="24" height="24" rx="5" />
  <rect class="tile tile-soft" x="34" y="34" width="24" height="24" rx="5" />
</svg>
